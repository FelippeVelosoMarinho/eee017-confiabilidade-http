name: petshop-confiabilidade

services:
  prometheus:
    build:
      context: ../..
      dockerfile: petshop/lab/prometheus.Dockerfile
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/petshop-tsdb
      - --storage.tsdb.retention.time=1500d
    ports:
      - "9090:9090"

  grafana:
    build:
      context: ../..
      dockerfile: petshop/lab/grafana.Dockerfile
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/plugins:/etc/grafana/provisioning/plugins:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../ufmg-reliability-app/provisioning/dashboards/ufmg/petshop.json:/var/lib/grafana/dashboards/petshop.json:ro
